[package]
name = "emperor"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
syn = { version = "2.0.119", features = ["full"] }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
cucumber = "0.23.0"
futures = "0.3.34"
tempfile = "3.27.0"

[[test]]
name = "features"
harness = false
