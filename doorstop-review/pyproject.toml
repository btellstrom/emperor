[project]
name = "doorstop-review"
version = "0.1.0"
description = "Review a Doorstop tree's requirements, and the Gherkin scenarios that justify them, one at a time"
requires-python = ">=3.14"
dependencies = [
    "doorstop>=3.2",
]

[project.scripts]
doorstop-review = "doorstop_review.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "features"

[tool.ruff]
line-length = 100
